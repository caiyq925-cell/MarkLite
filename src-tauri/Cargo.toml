[package]
name = "marklite"
version = "0.1.0"
description = "Lightweight offline Markdown viewer for Windows"
authors = ["MarkLite"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "marklite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
dunce = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"
